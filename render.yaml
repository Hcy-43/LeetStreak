# Render blueprint. The web service is free; the database is Neon (also free), so
# DATABASE_URL is set by hand rather than by Render.
#
# Paste connection strings and keys WITHOUT surrounding quotes. Providers show them
# as DATABASE_URL="postgres://..." because that is shell syntax; the quotes are not
# part of the value.
#
# Free services sleep after 15 minutes idle and take ~1 minute to wake. Keep it warm
# with an external pinger against /healthz every 10 minutes - cron-job.org and
# UptimeRobot both do this free. Render's own cron jobs are $1/month, so they are not
# part of this blueprint.
#
# Staying awake all month costs about 720 of the free tier's 750 instance-hours, so
# this is the only free service you can run continuously in the workspace.

services:
  - type: web
    name: leetstreak
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Paste the Neon connection string here in the dashboard, or set it as a
      # secret. It is not in this file because it contains a password.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false          # https://leetstreak.onrender.com, or your domain
      # Gmail SMTP with an App Password: no domain needed, delivers to anyone.
      # Swap these for RESEND_API_KEY once you own a sending domain.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Must be the same address as SMTP_USERNAME, or Gmail rewrites the header.
      # Format: LeetStreak <you@gmail.com>
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Must stay comfortably above the sync concurrency, or a background refresh
      # takes every connection and page loads fail with a pool timeout. Neon's free
      # compute allows around a hundred, so this is still conservative.
      - key: DB_POOL_MAX
        value: "10"
      # Shared secret for the hourly reminder + sync endpoints.
      - key: CRON_TOKEN
        generateValue: true
      # Hour, on each group's own clock, when reminders go out.
      - key: NUDGE_HOUR
        value: "20"
