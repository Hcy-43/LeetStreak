# Any VPS with Docker. Caddy terminates TLS and gets certificates automatically.
#
#   LEETSTREAK_DOMAIN=streaks.example.com docker compose up -d
#
# Secrets come from a .env file next to this one - see .env.example.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://leetstreak:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/leetstreak
      BASE_URL: https://${LEETSTREAK_DOMAIN:?set LEETSTREAK_DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leetstreak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: leetstreak
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leetstreak"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LEETSTREAK_DOMAIN: ${LEETSTREAK_DOMAIN:?set LEETSTREAK_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
